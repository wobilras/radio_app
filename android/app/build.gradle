plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigning = [
    storeFile: providers.environmentVariable("RADIO_RELEASE_STORE_FILE").orNull,
    storePassword: providers.environmentVariable("RADIO_RELEASE_STORE_PASSWORD").orNull,
    keyAlias: providers.environmentVariable("RADIO_RELEASE_KEY_ALIAS").orNull,
    keyPassword: providers.environmentVariable("RADIO_RELEASE_KEY_PASSWORD").orNull
]
def hasReleaseSigning = releaseSigning.values().every { it }

android {
    namespace = "com.example.radio_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.radio_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseSigning.storeFile)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

gradle.taskGraph.whenReady { graph ->
    def releaseTasks = ["assembleRelease", "bundleRelease", "packageRelease", "packageReleaseBundle"]
    if (!hasReleaseSigning && releaseTasks.any { graph.hasTask(":app:${it}") }) {
        throw new GradleException("Set RADIO_RELEASE_STORE_FILE, RADIO_RELEASE_STORE_PASSWORD, RADIO_RELEASE_KEY_ALIAS and RADIO_RELEASE_KEY_PASSWORD to sign the Android release.")
    }
}
